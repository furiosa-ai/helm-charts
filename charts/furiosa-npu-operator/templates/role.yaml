apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "furiosa-npu-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "furiosa-npu-operator.labels" . | nindent 4 }}
rules:
  # Leader election (config/rbac/leader_election_role.yaml)
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
