apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "furiosa-npu-operator.fullname" . }}
  labels:
    {{- include "furiosa-npu-operator.labels" . | nindent 4 }}
rules:
  # Manager ClusterRole (config/rbac/role.yaml)
  - apiGroups:
      - furiosa.ai
    resources:
      - furiosaclusterconfigs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - furiosa.ai
    resources:
      - furiosaclusterconfigs/finalizers
    verbs:
      - update
  - apiGroups:
      - furiosa.ai
    resources:
      - furiosaclusterconfigs/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - clusterrolebindings
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - resource.k8s.io
    resources:
      - deviceclasses
    verbs:
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceclaims
    verbs:
      - get
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceslices
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceclaims/status
    verbs:
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
  # Metrics auth (config/rbac/metrics_auth_role.yaml)
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
