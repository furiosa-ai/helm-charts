image:
  repository: docker.io/furiosaai/furiosa-feature-discovery
  pullPolicy: IfNotPresent
  tag: ""  # If empty, AppVersion will be used as a tag.

imagePullSecrets: []
# - name: "docker-secret"

daemonSet:
  priorityClassName: system-node-critical
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: feature.node.kubernetes.io/pci-1200_1ed2.present
                operator: In
                values:
                  - "true"

  resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

  # add toleration as needed
  tolerations: []
  #  - key: furiosa.ai/npu
  #    operator: Exists

node-feature-discovery:
  enabled: true
  worker:
    # add toleration as needed
    # tolerations:
    #   - key: "furiosa.ai/npu"
    #     operator: "Exists"
    config:
      core:
        # Only the label sources relevant to the Furiosa NPU stack:
        # - pci: feature.node.kubernetes.io/pci-1200_1ed2.present (NPU node affinity)
        # - system: feature.node.kubernetes.io/system-os_release.{ID,VERSION_ID} (node OS)
        # - kernel: feature.node.kubernetes.io/kernel-version.* (kernel the NPU driver is built for)
        # - local: furiosa-feature-discovery labels written to features.d/
        labelSources: ["pci", "system", "kernel", "local"]
      sources:
        pci:
          deviceClassWhitelist: ["1200"]
          deviceLabelFields: ["class", "vendor"]
